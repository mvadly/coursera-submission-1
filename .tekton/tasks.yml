---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Removes all files from the shared pipeline workspace before a new run.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      workingDir: $(workspaces.source.path)
      script: |
        rm -rf ./*
        echo "Workspace cleaned:"
        ls -la
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jest
spec:
  description: Runs the Jest unit tests for the Node.js counter service.
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: --runInBand
  steps:
    - name: install-dependencies
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm install
    - name: run-jest-tests
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm test $(params.args)