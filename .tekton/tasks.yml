---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Removes all files from the shared pipeline workspace.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      workingDir: $(workspaces.source.path)
      script: |
        rm -rf ./*
        echo "Workspace cleaned:"
        ls -la
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jest
spec:
  description: Clones the repository and runs the Jest unit tests.
  params:
    - name: git-url
      type: string
      default: https://github.com/mvadly/ci-cd-final-project.git
    - name: git-revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      workingDir: $(workspaces.source.path)
      script: |
        curl -o git.crt https://crt.sh/?d=SEC.crt
        git config --global http.sslCAInfo $(workspaces.source.path)/git.crt
        git clone "$(params.git-url)" -b "$(params.git-revision)" ./
    - name: install-dependencies
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm install
    - name: run-jest-tests
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm test